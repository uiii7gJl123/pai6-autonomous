<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>pai‑6 — Operational AI (v1.17)</title>
  <style>
    :root{color-scheme:light dark}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;line-height:1.5}
    header{padding:20px 24px;border-bottom:1px solid #e5e7eb}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .card{border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    h1{font-size:1.6rem;margin:.2rem 0}
    button{padding:10px 14px;border-radius:10px;border:1px solid #d1d5db;background:#fff;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>pai‑6 — Operational AI (v1.17)</h1></div></header>
  <main class="wrap">
    <div class="card">
      <p>هذه نسخة Render جاهزة. الواجهة الأمامية تُقدّم من نفس الخدمة. جرّب نداء API:</p>
      <button id="btn">/api/echo</button>
      <pre id="out">—</pre>
    </div>
    <div class="card"><a href="/health">/health</a></div>
  </main>
  <script>
    document.getElementById('btn').onclick = async () => {
      const res = await fetch('/api/echo', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message:'hello from frontend', meta:{ts: Date.now()}})
      });
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
